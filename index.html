const ITERATIONS = 200000;

async function decryptReport(password, b64) {
  const raw  = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16);
  const iv   = raw.slice(16, 28);
  const data = raw.slice(28);
  const keyMaterial = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(plain);
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Расшифровка…';
  try {
    const html = await decryptReport(document.getElementById('pwd').value, ENCRYPTED_REPORT);
    // Отчёт открывается в этой же вкладке (новое окно часто режет блокировщик всплывающих окон)
    document.open();
    document.write(html);
    document.close();
  } catch (_) {
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Открыть отчёт';
  }
});
